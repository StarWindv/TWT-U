plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// 读取当前 git 分支名，用于编译产物命名（<mod名>-<版本>-<分支名>.jar）
def gitBranch = {
	def headFile = file('.git/HEAD')
	if (!headFile.exists()) return 'unknown'
	def ref = headFile.text.trim()
	if (ref.startsWith('ref: refs/heads/')) {
		return ref.substring('ref: refs/heads/'.length())
	}
	return ref.take(7)
}()

version = "${project.mod_version}-${gitBranch}"
group = project.maven_group

repositories {}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/twt-u.accesswidener")

	mods {
		"twt-u" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

}

processResources {
	inputs.property "version", project.mod_version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {}
}